model:
  person_conf_threshold: 0.6
  gies:
    person:
      kind: detector
      source: models/person/yolo26n.pt
      uid: 1
    helmet:
      kind: detector
      source: models/helmet/1107-update/best.pt
      uid: 3
      violation: head
    harness_cls:
      kind: classifier
      source: models/harness/yolo26m_cls_harness_20260817_0547/weights/best.pt
      uid: 5
      violation: no_harness
    vest_cls:
      kind: classifier
      source: models/vest/yolo26mcls_ppeVest_20260904_0959/weights/best.pt
      uid: 6
      violation: no_vest
    smoke:
      kind: detector
      attach: person
      source: models/smoke/yolo26m_smoking_20260707_0224/weights/best.pt
      uid: 7
      violation: cigarette
rules:
  no_helmet:
    gie: helmet
    cooldown_seconds: 10
    min_detection_count: 3
    attribute_threshold: 0.5
  no_vest:
    gie: vest_cls
    cooldown_seconds: 300
    min_detection_count: 15
    attribute_threshold: 0.8
  no_harness:
    gie: harness_cls
    cooldown_seconds: 30
    min_detection_count: 5
    attribute_threshold: 0.7
  smoking:
    gie: smoke
    cooldown_seconds: 30
    min_detection_count: 3
    attribute_threshold: 0.75
  intrusion:
    gie: person
    trigger: presence
    cooldown_seconds: 0
    min_detection_count: 5
    vacant_frames: 50
    attribute_threshold: 0.5
    alert_type: intrusion
webhook:
  url: http://192.168.1.24:6034/protal/ai-alarm/webhook
  timeout: 10
  retries: 2
vlm:
  enabled: true
  shadow: true
  url: http://vllm:8013/v1/chat/completions
  model: /model/Qwen2.5-VL-7B-Instruct-AWQ
  rules:
  - smoking
  - no_helmet
  - no_vest
  sample_ms: 700
  deadline_ms: 5500
  timeout: 4
  pad: 0.15
  fail_open: true
  score_gate:
    rules:
    - smoking
    threshold: 0.75
  audit: false
  audit_cycle_s: 2
  audit_dedup_ttl_s: 60
  audit_workers: 8
  audit_max_per_cycle: 6
  audit_dump_dir: temp2/vlm-audit
