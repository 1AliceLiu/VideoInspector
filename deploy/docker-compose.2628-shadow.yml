# =============================================================================
# 【2628 区域功能影子实例】与生产同机、独立容器、锁空闲 GPU
# =============================================================================
# 与生产并存的前提（均已在本仓库核实）：
#   - 本机 3× L20；生产占 GPU0（~38GB），GPU1/GPU2 空闲 → 本实例锁 GPU1
#   - 引擎指纹取 get_device_name(0)/cc（进程内索引），容器只见一张卡 → 指纹仍为
#     "NVIDIA L20|cc8.9" → 复用已构建引擎，**不触发 trtexec 重建**
#   - generated/ 挂**私有副本**：model_build 每次都刷新 labels.txt + INI
#     （tools/model_build.py:326-344），共用目录会与生产争写同一批文件
#   - runtime/ 不挂载 → 容器本地文件系统，两实例的 revision/reload 信号天然隔离
#   - 生产未配 output 节 → builder 的 shmsink(/tmp/vi_cam_i) 分支不执行，无 socket 互删
#
# 一次性准备（约 380MB，复制后影子实例不会再写生产产物）：
#   cp -a deploy/generated deploy/generated-2628
#
# 启动:  docker compose -f deploy/docker-compose.2628-shadow.yml up -d
# 停止:  docker compose -f deploy/docker-compose.2628-shadow.yml down   （只停本栈）
# 看日志: docker compose -f deploy/docker-compose.2628-shadow.yml logs -f detector
# 告警落盘: deploy/alerts-2628/
# =============================================================================
name: video-inspector-2628

services:
  detector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # ⚠ 独立 tag：不要复用 safety-detector:latest —— 那是生产在跑的镜像。
    #   若在这里 build 覆盖 latest，生产容器虽然当下不受影响，但下次任何重启
    #   （宿主重启 / compose up / 看门狗重建）都会**悄悄带上未验证的新代码**。
    image: safety-detector:zone-shadow
    container_name: safety-detector-2628
    privileged: true
    # 与生产一致：NVMM 跨进程共享内存需要（本容器内是 supervisor↔pipeline 两个进程）
    ipc: host
    shm_size: "2g"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]          # 锁空闲卡；见下方「必须验证」
              capabilities: [gpu, video, compute, utility]

    environment:
      # 只留能力项，不设 NVIDIA_VISIBLE_DEVICES=all —— 那会绕过上面的 device_ids
      - NVIDIA_DRIVER_CAPABILITIES=all
      - SAFETY_CONFIG=/app/deploy/config.yaml

    volumes:
      - ./config.2628-test.yaml:/app/deploy/config.yaml:ro
      - ./models:/app/deploy/models:ro
      - ./generated-2628:/app/deploy/generated      # 私有副本，绝不写生产产物
      - ./logs:/app/deploy/logs                     # 影子写 logs/server-2628-test.log
      - ./alerts-2628:/app/deploy/alerts

    ports:
      - "18005:8554/tcp"    # 预览输出；config 未配 output 节时该映射闲置

    # 不接生产真实下游：告警只发给本栈内的接收端容器
    networks:
      - safety-2628-net

    restart: unless-stopped

  alert-receiver:
    image: python:3.11-slim
    container_name: alert-receiver-2628
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir loguru==0.7.3 &&
             python3 -u /app/receiver.py --port 9999 --save-dir /app/alerts"
    volumes:
      - ../local/webhook_receiver.py:/app/receiver.py:ro
      - ./alerts-2628:/app/alerts
    ports:
      # 看板入口：浏览器打开 http://<服务器IP>:19999/
      - "19999:9999/tcp"
    networks:
      - safety-2628-net
    restart: unless-stopped

networks:
  safety-2628-net:
    driver: bridge
